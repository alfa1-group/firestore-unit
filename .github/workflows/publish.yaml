name: Publish package to the Maven Central Repository and GitHub Packages
on:
  # Called by release.yaml (releases created with GITHUB_TOKEN don't trigger the release event)
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  # Manually created releases
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
      - name: Set up Java for publishing to GitHub Packages
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [{
                "id": "central",
                "username": "${{ secrets.SONATYPE_USERNAME }}",
                "password": "${{ secrets.SONATYPE_PASSWORD }}"
             }]
      - name: Update version in pom.xml
        run: ./mvnw -B versions:set -DnewVersion=${{ inputs.version || github.event.release.tag_name }} -DgenerateBackupPoms=false
      - name: Publish to the Maven Central Repository
        run: |
          echo "${MAVEN_GPG_KEY}" > private_key.txt
          gpg --import --batch private_key.txt
          ./mvnw --batch-mode -P release -P release-to-central deploy
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      - name: Publish to GitHub Packages
        run: ./mvnw --batch-mode -P release -P release-to-github deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
